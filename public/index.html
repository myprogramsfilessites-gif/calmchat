<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CalmChat — вход</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%236366f1'/%3E%3Ctext x='12' y='16.5' font-size='12' text-anchor='middle' fill='white' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">C</div>
      <h1>CalmChat</h1>
      <p class="auth-sub">Переписка и звонки с друзьями</p>

      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Вход</button>
        <button id="tab-reg" class="tab" type="button">Регистрация</button>
      </div>

      <form id="login-form">
        <input id="login-id" placeholder="Ник или ID" autocomplete="username">
        <input id="login-pass" type="password" placeholder="Пароль" autocomplete="current-password">
        <button type="submit" class="btn primary block">Войти</button>
      </form>

      <form id="reg-form" hidden>
        <input id="reg-nick" placeholder="Ник (до 24 символов)" autocomplete="off" maxlength="24">
        <input id="reg-pass" type="password" placeholder="Пароль (минимум 4 символа)" autocomplete="new-password">
        <div class="avatar-picker" id="reg-avatars"></div>
        <button type="submit" class="btn primary block">Создать аккаунт</button>
      </form>

      <p class="error" id="auth-error"></p>
      <p class="auth-success" id="auth-success" hidden>
        Аккаунт создан. Твой ID: <b id="success-id"></b>
      </p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
